# ============================================================
# GeoMesh Infrastruktur Only — Docker Compose
# ============================================================
# Hanya menjalankan services infrastruktur (DB, Redis, EMQX, Keycloak)
# Backend & Frontend dijalankan langsung di host (tidak di Docker)
#
# Usage:
#   docker-compose -f docker-compose.infra.yml up -d

services:
  # 1. EMQX MQTT Broker
  emqx:
    image: emqx/emqx:5.7.0
    container_name: geomesh-emqx
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    environment:
      - "EMQX_DASHBOARD__BOOTSTRAP_USER_PASSWD=admin_geomesh"
    volumes:
      - emqx-data:/opt/emqx/data
    restart: always

  # 2. Database PostgreSQL + TimescaleDB
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: geomesh-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=geomesh
      - POSTGRES_USER=geouser
      - POSTGRES_PASSWORD=geopassword
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: always

  # 3. Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: geomesh-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

  # 4. Keycloak (Identity & Access Management)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: geomesh-auth
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    depends_on:
      - timescaledb
    restart: always

volumes:
  emqx-data:
  pg-data:
  redis-data:
