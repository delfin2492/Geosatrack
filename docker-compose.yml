version: '3.8'

services:
  # 1. EMQX MQTT Broker (Broker IoT)
  emqx:
    image: emqx/emqx:5.7.0
    container_name: geomesh-emqx
    ports:
      - "1883:1883"      # Port MQTT TCP
      - "8083:8083"      # Port MQTT WebSockets
      - "18083:18083"    # EMQX Dashboard
    environment:
      - "EMQX_DASHBOARD__BOOTSTRAP_USER_PASSWD=admin_geomesh"
    volumes:
      - emqx-data:/opt/emqx/data
    restart: always

  # 2. Database PostgreSQL + TimescaleDB (Relational & Time-Series)
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: geomesh-db
    ports:
      - "5432:5432"      # Port PostgreSQL/TimescaleDB
    environment:
      - POSTGRES_DB=geomesh
      - POSTGRES_USER=geouser
      - POSTGRES_PASSWORD=geopassword
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: always

  # 3. Redis Cache (Penyimpanan state & koordinat real-time)
  redis:
    image: redis:7.2-alpine
    container_name: geomesh-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

  # 4. Identity & Access Management (Keycloak OAuth2/OIDC)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: geomesh-auth
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    depends_on:
      - timescaledb
    restart: always

  # 5. NestJS Backend Application
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: geomesh-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_USER=geouser
      - DB_PASSWORD=geopassword
      - DB_NAME=geomesh
      - DATABASE_URL=postgresql://geouser:geopassword@timescaledb:5432/geomesh?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MQTT_BROKER_URL=mqtt://emqx:1883
      - MQTT_USERNAME=admin_geomesh
      - MQTT_PASSWORD=admin_geomesh
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=geomesh
      - KEYCLOAK_CLIENT_ID=geomesh-app
      - KEYCLOAK_CLIENT_SECRET=change-me-on-production
      - JWT_SECRET=super-secret-jwt-key-change-me
    command: sh -c "npx prisma db push --schema=apps/backend/prisma/schema.prisma && npm run start:prod --workspace=apps/backend"
    volumes:
      - ./apps/backend/uploads:/app/apps/backend/uploads
    depends_on:
      - timescaledb
      - redis
      - emqx
    restart: always

  # 6. Next.js Frontend Application
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:4000/api
        - NEXT_PUBLIC_WS_URL=ws://localhost:4000
        - NEXT_PUBLIC_KEYCLOAK_URL=http://localhost:8080
        - NEXT_PUBLIC_KEYCLOAK_REALM=geomesh
        - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=geomesh-frontend
    container_name: geomesh-frontend
    ports:
      - "3300:3300"
    depends_on:
      - backend
    restart: always

volumes:
  emqx-data:
  pg-data:
  redis-data:

